          - Bagaimana ML Bekerja: introduction-to-machine-learning/05-how-machine-learning-works.md
          - Komponen Dasar: introduction-to-machine-learning/06-basic-components.md
          - Penerapan di Dunia Nyata: introduction-to-machine-learning/07-real-world-applications.md
          - Workflow Machine Learning: introduction-to-machine-learning/08-machine-learning-workflow.md
          - Jenis Masalah ML: introduction-to-machine-learning/09-machine-learning-problems.md
          - Peran ML dalam Clustering: introduction-to-machine-learning/10-role-of-ml-in-clustering.md
          - Praktik Pertama: introduction-to-machine-learning/11-hands-on-introduction.md
          - Latihan: introduction-to-machine-learning/12-exercises.md
          - Ringkasan: introduction-to-machine-learning/13-summary.md
          - Referensi: introduction-to-machine-learning/14-references.md
      - Bab 2 — Types of Machine Learning:
          - types-of-machine-learning/index.md
          - Pendahuluan: types-of-machine-learning/01-introduction.md
          - Labeled dan Unlabeled Data: types-of-machine-learning/02-labeled-and-unlabeled-data.md
          - Supervised Learning: types-of-machine-learning/03-supervised-learning.md
          - Classification: types-of-machine-learning/04-classification.md
          - Regression: types-of-machine-learning/05-regression.md
          - Unsupervised Learning: types-of-machine-learning/06-unsupervised-learning.md
